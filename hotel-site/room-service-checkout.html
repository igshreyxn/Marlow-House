<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — Room Service — Marlow House</title>
<meta name="description" content="Complete your room service order at Marlow House." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">

<!--
  Firebase SDK (add before js/shared.js, once you have a project config):
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
-->
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="wordmark">Marlow House</a>
    <nav class="main-nav" aria-label="Primary">
      <a href="rooms.html">Rooms</a>
      <a href="room-service.html">Room Service</a>
      <a href="index.html#about">About</a>
      <a href="my-bookings.html">My Bookings</a>
    </nav>
    <div class="header-actions">
      <a href="room-service.html" class="btn btn-ghost">Back to Menu</a>
    </div>
  </div>
</header>

<section class="section" style="padding-top:var(--space-xl)">
  <div class="wrap">

    <!-- Shown if someone lands here with an empty/no order -->
    <div id="checkout-empty" style="display:none;max-width:520px;margin-inline:auto;text-align:center">
      <h1 style="font-family:var(--font-display);font-size:var(--step-2)">No order started yet</h1>
      <p>Add some dishes from the menu first, then come back here to check out.</p>
      <a href="room-service.html" class="btn btn-primary" style="margin-top:var(--space-md)">Browse Menu</a>
    </div>

    <div id="checkout-content" class="checkout-grid">
      <aside class="summary-card" id="order-summary"></aside>

      <div>
        <h1 style="font-family:var(--font-display);font-size:var(--step-2);margin-bottom:var(--space-md)">Complete your order</h1>

        <form id="room-service-form">
          <h3 class="checkout-section-title">Delivery details</h3>
          <div class="field"><label for="room-number">Room number</label><input type="text" id="room-number" name="room-number" required></div>
          <div class="field"><label for="phone">Phone number</label><input type="tel" id="phone" name="phone" required></div>
          <div class="field">
            <label for="message">Delivery notes (optional)</label>
            <textarea id="message" name="message" rows="3" style="border:1px solid var(--line);border-radius:var(--radius);padding:0.7rem 0.85rem;font-family:inherit;font-size:inherit;resize:vertical" placeholder="e.g. no onions, extra napkins, ring the doorbell softly"></textarea>
          </div>

          <h3 class="checkout-section-title">Payment method</h3>
          <div class="payment-options">
            <label class="payment-option">
              <input type="radio" name="payment-method" value="card" checked>
              <span>Card</span>
            </label>
            <label class="payment-option">
              <input type="radio" name="payment-method" value="upi">
              <span>UPI</span>
            </label>
            <label class="payment-option">
              <input type="radio" name="payment-method" value="room-charge">
              <span>Charge to Room</span>
            </label>
          </div>

          <div id="card-fields" class="card-fields">
            <div class="field" style="grid-column:1/-1"><label for="card-number">Card number</label><input type="text" id="card-number" name="card-number" placeholder="1234 5678 9012 3456"></div>
            <div class="field"><label for="card-expiry">Expiry</label><input type="text" id="card-expiry" name="card-expiry" placeholder="MM/YY"></div>
            <div class="field"><label for="card-cvv">CVV</label><input type="text" id="card-cvv" name="card-cvv" placeholder="123"></div>
          </div>

          <p class="form-error" id="order-error"></p>

          <button type="submit" id="confirm-order-btn" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:var(--space-md)">Confirm & Pay</button>
        </form>
      </div>
    </div>

    <div id="checkout-confirmation" style="display:none;max-width:520px;margin-inline:auto;text-align:center"></div>

  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 Marlow House</span>
      <a href="index.html">Back to home</a>
    </div>
  </div>
</footer>

<script src="js/shared.js"></script>
<script src="js/room-service-checkout.js"></script>
</body>
</html>
